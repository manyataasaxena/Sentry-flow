[project]
name = "sentryflow"
version = "0.1.0"
description = "Governed Multi-Agent Orchestration Platform with LangGraph, Circuit Breakers, and Adversarial Evals"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "langgraph>=0.2.20",
    "langchain-core>=0.3.0",
    "instructor>=1.4.0",
    "langfuse>=2.50.0",
    "psycopg[binary,pool]>=3.2.0",
    "sqlalchemy>=2.0.35",
    "asyncpg>=0.29.0",
    "redis>=5.0.8",
    "httpx>=0.27.2",
    "structlog>=24.4.0",
    "tenacity>=9.0.0",
    "pyyaml>=6.0.2",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
    "mypy>=1.11.0",
    "ruff>=0.6.0",
    "import-linter>=2.0",
    "openapi-spec-validator>=0.7.1",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ASYNC", # flake8-async
    "T20", # flake8-print
]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "langfuse.*",
    "psycopg_pool.*",
    "passlib.*",
    "jose.*",
]
ignore_missing_imports = true

[tool.importlinter]
root_package = "app"

[[tool.importlinter.contracts]]
name = "Hexagonal Dependency Boundaries"
type = "layers"
layers = [
    "app.api",
    "app.db",
    "app.agents",
    "app.core",
    "app.schemas",
]
containers = ["app"]
