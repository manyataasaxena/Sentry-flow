services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: sentryflow
      POSTGRES_USER: sentryflow
      POSTGRES_PASSWORD: sentryflow
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentryflow -d sentryflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: development
      POSTGRES_DSN: postgresql://sentryflow:sentryflow@postgres:5432/sentryflow
      REDIS_URL: redis://redis:6379/0
      MOCK_LLM: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://127.0.0.1:8000/api/v1}
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  postgres_data:
